<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opprett konto – Christmas Gift Tag</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="small"><h1>🎄 Opprett brukerkonto</h1><section><p>Opprett din egen private konto for å lage gaveetiketter.</p>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/register" class="stack"><label>Brukernavn<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" autocomplete="username" required autofocus></label><label>Navn som brukes som avsender (valgfritt)<input name="display_name" maxlength="120" autocomplete="name" placeholder="Standard: brukernavn"></label><label>Passord (minst 12 tegn)<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Bekreft passord<input name="password_confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>Opprett konto</button></form><p><a href="/login">Tilbake til innlogging</a></p></section></main></body></html>
